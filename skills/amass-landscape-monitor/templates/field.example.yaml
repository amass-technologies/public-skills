name: taar1-schizophrenia
question: TAAR1 agonists and ulotaront in schizophrenia and related psychiatric indications
created: 2026-10-08
cores: [drugcore, genecore, trialcore, biomedcore, regulatorycore, patentcore]
include:
  - Clinical trials (any phase, status or registry) of a TAAR1 agonist in schizophrenia or another psychiatric or neurological indication, including healthy-volunteer and PK studies of such a drug
  - Papers reporting clinical, translational or pharmacological work on a TAAR1 agonist, or on TAAR1 as a target in psychiatry
  - Drugs whose mechanism of action includes TAAR1 agonism; the TAAR1 gene record
  - FDA or EMA authorizations of a TAAR1 agonist
  - Patents claiming TAAR1 agonist compounds, their formulations or their use in psychiatric disease
exclude:
  - Solriamfetol and other drugs where TAAR1 activity is incidental, when studied in sleep or non-psychiatric indications
  - Trace amine or TAAR1 biology with no agonist drug and no psychiatric angle (olfaction, metabolism, TAAR1 knockout physiology)
  - Antipsychotic trials that merely use a TAAR1 agonist as a comparator name in background text
anchors:
  - core: trialcore
    id: NCT07759128
    note: a Phase 3 ulotaront trial a limit-15 search missed on 2026-10-05
  - core: trialcore
    id: NCT07225712
    note: Japanese ulotaront trial (NCT record)
  - core: trialcore
    id: JPRN-jRCT2071250092
    note: the same Japanese trial (jRCT record)
entities:
